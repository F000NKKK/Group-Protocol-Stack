[package]
name = "gbp-stack-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Browser/WASM bindings for the Group Protocol Stack."
keywords = ["mls", "e2ee", "wasm", "group-messaging", "webassembly"]
categories = ["cryptography", "wasm", "network-programming"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gbp-core      = { workspace = true }
gbp-mls       = { workspace = true }
gbp-node      = { workspace = true }
gtp-protocol  = { workspace = true }
gap-protocol  = { workspace = true }
gsp-protocol  = { workspace = true }
gbp-sframe    = { workspace = true }
wasm-bindgen      = { workspace = true }
js-sys            = { workspace = true }
getrandom         = { workspace = true }
getrandom4        = { workspace = true }
fluvio-wasm-timer = { workspace = true }
# Enable openmls WASM/JS backend (secure randomness + time via Web APIs)
openmls           = { workspace = true, features = ["js"] }

[dev-dependencies]
wasm-bindgen-test = { workspace = true }
ciborium          = { workspace = true }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-mutable-globals"]
