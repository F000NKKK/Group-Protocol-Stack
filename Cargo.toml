[workspace]
resolver = "2"
members = [
    "crates/gbp/core",
    "crates/gbp/base",
    "crates/gbp/mls",
    "crates/gbp/transport",
    "crates/gbp/node",
    "crates/gbp/stack",
    "crates/gbp/stack-ffi",
    "crates/gbp/wasm",
    "crates/gbp/cli",
    "crates/gtp",
    "crates/gap",
    "crates/gsp",
    "crates/gbp-sframe",
    "crates/gbp-proto",
    "crates/gbp-flat",
]

[workspace.package]
version = "1.8.2"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
authors = ["Group Protocol Stack contributors"]
repository = "https://github.com/F000NKKK/Group-Protocol-Stack"
homepage = "https://github.com/F000NKKK/Group-Protocol-Stack"
documentation = "https://docs.rs/gbp-stack"
readme = "README.md"
keywords = ["mls", "rfc9420", "group", "messaging", "e2ee"]
categories = ["cryptography", "network-programming"]

[workspace.dependencies]
# Internal — base layer
gbp-core      = { path = "crates/gbp/core",      version = "1.8.2" }
gbp-protocol  = { path = "crates/gbp/base",      version = "1.8.2" }
gbp-mls       = { path = "crates/gbp/mls",       version = "1.8.2" }
gbp-transport = { path = "crates/gbp/transport", version = "1.8.2" }
gbp-node      = { path = "crates/gbp/node",      version = "1.8.2" }
gbp-stack     = { path = "crates/gbp/stack",     version = "1.8.2" }

# Internal — sub-protocols
gtp-protocol = { path = "crates/gtp", version = "1.8.2" }
gap-protocol = { path = "crates/gap", version = "1.8.2" }
gsp-protocol = { path = "crates/gsp", version = "1.8.2" }

# External
openmls                  = "0.8"
openmls_rust_crypto      = "0.5"
openmls_basic_credential = "0.5"
openmls_traits           = "0.5"

ciborium    = "0.2"
serde       = { version = "1", features = ["derive"] }
serde_bytes = "0.11"

# wasm bindings
wasm-bindgen      = "0.2"
wasm-bindgen-test = "0.3"
js-sys            = "0.3"
fluvio-wasm-timer = "0.2"

# rand 0.8 chain (openmls) needs getrandom 0.2's "js" backend; chacha20poly1305's
# aead 0.6 chain pulls getrandom 0.4 separately, needing its "wasm_js" backend.
getrandom  = { version = "0.2", features = ["js"] }
getrandom4 = { package = "getrandom", version = "0.4", default-features = false, features = ["wasm_js"] }

chacha20poly1305 = "0.11"
sha2              = "0.11"
sframe            = { version = "1.3", default-features = false, features = ["ring"] }

gbp-sframe = { path = "crates/gbp-sframe", version = "1.8.2" }
gbp-proto  = { path = "crates/gbp-proto",  version = "1.8.2" }
gbp-flat   = { path = "crates/gbp-flat",   version = "1.8.2" }

prost = "0.14"

planus              = "1.3"
planus-translation  = "1.3"
planus-codegen      = "1.3"

quinn  = "0.11"
rustls = { version = "0.23", features = ["ring"] }
rcgen  = "0.14"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }

thiserror          = "2"
anyhow             = "1"
hex                = "0.4"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json         = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 0
debug = true
